<header class="site-header">
  <a class="site-header__brand" [routerLink]="['/characters-list']">
    <span class="site-header__mark">R&amp;M</span>
    <span>Multiverse Explorer</span>
  </a>
  <nav class="site-header__nav" aria-label="Main navigation">
    <a [routerLink]="['/characters-list']" routerLinkActive="is-active"
      >Characters</a
    >
    <a
      [routerLink]="['/home']"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      aria-label="Open favorite characters"
      >Favorites</a
    >
    <a [routerLink]="['/episodes']" routerLinkActive="is-active">Episodes</a>
    <a [routerLink]="['/about']" routerLinkActive="is-active">About</a>
  </nav>
  <span class="site-header__status"><span></span> Data feed online</span>
</header>
