<app-spinner (isLoading)="(true)"></app-spinner>
<article class="character-card">
  <button
    class="character-card__image-button"
    type="button"
    (click)="viewDetails.emit(character)"
    [attr.aria-label]="'View details for ' + character.name"
  >
    <img
      class="character-card__image"
      [src]="character.image"
      [alt]="character.name"
    />
  </button>
  <div class="character-card__content">
    <div class="character-card__heading">
      <div>
        <span class="character-card__species">{{ character.species }}</span>
        <button
          class="character-card__name"
          type="button"
          (click)="viewDetails.emit(character)"
        >
          {{ character.name }}
        </button>
      </div>
      <button
        class="favorite-button"
        type="button"
        (click)="toggleFavorite()"
        [attr.aria-label]="
          character.isFavorite ? 'Remove favorite' : 'Add favorite'
        "
      >
        <img
          [src]="'assets/imgs/' + getIcon()"
          [alt]="character.isFavorite ? 'Favorite' : 'Not favorite'"
        />
      </button>
    </div>
    <div class="character-card__status">
      <span
        class="status-dot"
        [class.status-dot--alive]="character.status === 'Alive'"
        [class.status-dot--dead]="character.status === 'Dead'"
      ></span>
      <span>{{ character.status }}</span>
    </div>
    <dl class="character-card__facts">
      <div>
        <dt>Gender</dt>
        <dd>{{ character.gender }}</dd>
      </div>
      <div>
        <dt>Origin</dt>
        <dd>{{ character.origin?.name || "Unknown" }}</dd>
      </div>
    </dl>
  </div>
</article>
